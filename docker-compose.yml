services:

  # ── App + Hydra database (MySQL) ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: identity_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: identity_db
      MYSQL_USER: identity_user
      MYSQL_PASSWORD: identity_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Run Hydra DB migrations once ─────────────────────────────────────────
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql --yes "mysql://identity_user:identity_pass@tcp(db:3306)/hydra?parseTime=true&multiStatements=true"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── Ory Hydra OAuth2 server ───────────────────────────────────────────────
  hydra:
    image: oryd/hydra:v2.2.0
    container_name: hydra
    restart: unless-stopped
    ports:
      - "4444:4444"   # public  — token endpoint (companies call this)
      - "4445:4445"   # admin   — client management + introspection
    environment:
      DSN: mysql://identity_user:identity_pass@tcp(db:3306)/hydra?parseTime=true&multiStatements=true
      SECRETS_SYSTEM: natid-hydra-secret-change-in-production!!
      URLS_SELF_ISSUER: http://localhost:4444/
      LOG_LEVEL: info
      URLS_LOGIN: http://localhost:5500/user/hydra-login.html
      URLS_CONSENT: http://localhost:5500/user/hydra-consent.html
      URLS_ERROR: http://localhost:5500/user/hydra-error.html
      SERVE_PUBLIC_CORS_ENABLED: "true"
      SERVE_ADMIN_CORS_ENABLED: "true"
    command: serve all --dev
    depends_on:
      - hydra-migrate

  # ── MailHog (local email catcher for development) ────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — the app sends emails here
      - "8025:8025"   # Web UI — open http://localhost:8025 to read emails

volumes:
  mysql_data:
