<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Companies - NatID Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID - Admin Portal</span>
    <div>
      <a href="dashboard.html" class="nav-link d-inline">Dashboard</a>
      <a href="users.html" class="nav-link d-inline">Users</a>
      <a href="companies.html" class="nav-link d-inline">Companies</a>
      <a href="access-logs.html" class="nav-link d-inline">Access Logs</a>
      <a href="#" onclick="logoutAdmin()" class="nav-link d-inline">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h4>All Companies</h4>

  <div class="card">
    <div class="card-body">
      <table class="table">
        <thead>
          <tr><th>Company</th><th>Type</th><th>Registered</th><th>Requested Scopes</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="companiesBody"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  requireAdminAuth();

  async function loadCompanies() {
    const token = getToken('admin_token');
    const tbody = document.getElementById('companiesBody');

    try {
      const companies = await get(API + '/admin/companies', token);

      if (companies.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-muted">No companies yet.</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      for (let i = 0; i < companies.length; i++) {
        const c = companies[i];

        let statusHtml;
        if (c.is_approved) {
          statusHtml = '<span class="status-approved">Approved</span>';
        } else if (!c.is_active) {
          statusHtml = '<span class="status-rejected">Rejected</span>';
        } else {
          statusHtml = '<span class="status-pending">Pending</span>';
        }

        // build the scope tags
        let scopesHtml = '<span class="text-muted small">None requested</span>';
        if (c.requested_scopes && c.requested_scopes.trim() !== '') {
          const scopeList = c.requested_scopes.split(',');
          scopesHtml = '';
          for (let j = 0; j < scopeList.length; j++) {
            const s = scopeList[j].trim();
            if (s) scopesHtml += '<span class="scope-tag">' + s + '</span> ';
          }
        }

        const date = new Date(c.created_at).toLocaleDateString();
        const btnClass = c.is_approved ? 'btn-outline-secondary' : 'btn-primary';
        const btnLabel = c.is_approved ? 'View' : 'Review';

        tbody.innerHTML += '<tr>' +
          '<td>' + c.name + '</td>' +
          '<td class="text-muted small">' + (c.company_type || '—') + '</td>' +
          '<td class="text-muted small">' + date + '</td>' +
          '<td>' + scopesHtml + '</td>' +
          '<td>' + statusHtml + '</td>' +
          '<td><a href="company-review.html?id=' + c.id + '" class="btn btn-sm ' + btnClass + '">' + btnLabel + '</a></td>' +
          '</tr>';
      }
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-danger">' + err.message + '</td></tr>';
    }
  }

  loadCompanies();
</script>
</body>
</html>
