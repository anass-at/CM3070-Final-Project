<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Companies - NatID Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar portal-admin">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID <span class="portal-badge bg-danger">Admin</span></span>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="users.html" class="nav-link">Users</a>
      <a href="companies.html" class="nav-link">Companies</a>
      <a href="access-logs.html" class="nav-link">Access Logs</a>
      <a href="#" onclick="logoutAdmin()" class="nav-link nav-logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h4>All Companies</h4>

  <div class="card">
    <div class="card-body">
      <table class="table align-middle">
        <thead>
          <tr><th style="width:52px">Logo</th><th>Company</th><th>Type</th><th>Registered</th><th>Requested Scopes</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="companiesBody"><tr><td colspan="7">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  requireAdminAuth();

  async function loadCompanies() {
    const token = getToken('admin_token');
    const tbody = document.getElementById('companiesBody');

    try {
      const companies = await get(API + '/admin/companies', token);

      if (companies.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-muted">No companies yet.</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      for (let i = 0; i < companies.length; i++) {
        const c = companies[i];

        let statusHtml;
        if (c.is_approved) {
          statusHtml = '<span class="status-approved">Approved</span>';
          // check if there are newly requested scopes not yet approved
          var approved = (c.approved_scopes || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
          var requested = (c.requested_scopes || []).map(function(item){ return item.scope; });
          var hasNew = requested.some(function(s){ return approved.indexOf(s) === -1; });
          if (hasNew) {
            statusHtml += ' <span class="badge bg-warning text-dark ms-1" style="font-size:10px;">Scope Update</span>';
          }
        } else if (!c.is_active) {
          statusHtml = '<span class="status-rejected">Rejected</span>';
        } else {
          statusHtml = '<span class="status-pending">Pending</span>';
        }

        // build the scope tags
        let scopesHtml = '<span class="text-muted small">None requested</span>';
        if (c.requested_scopes && c.requested_scopes.length > 0) {
          scopesHtml = '';
          for (let j = 0; j < c.requested_scopes.length; j++) {
            const s = c.requested_scopes[j].scope;
            if (s) scopesHtml += '<span class="scope-tag">' + s + '</span> ';
          }
        }

        const date = new Date(c.created_at).toLocaleDateString();
        const btnClass = c.is_approved ? 'btn-outline-secondary' : 'btn-primary';
        const btnLabel = c.is_approved ? 'View' : 'Review';

        let logoHtml;
        if (c.logo) {
          logoHtml = '<img src="http://localhost:8000' + c.logo + '" alt="logo" style="width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid #dee2e6;">';
        } else {
          logoHtml = '<div style="width:36px;height:36px;border-radius:6px;background:#e9ecef;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid #dee2e6;">&#127970;</div>';
        }

        tbody.innerHTML += '<tr>' +
          '<td>' + logoHtml + '</td>' +
          '<td>' + c.name + '</td>' +
          '<td class="text-muted small">' + (c.company_type || '—') + '</td>' +
          '<td class="text-muted small">' + date + '</td>' +
          '<td>' + scopesHtml + '</td>' +
          '<td>' + statusHtml + '</td>' +
          '<td><a href="company-review.html#' + c.id + '" class="btn btn-sm ' + btnClass + '">' + btnLabel + '</a></td>' +
          '</tr>';
      }
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-danger">' + err.message + '</td></tr>';
    }
  }

  loadCompanies();
</script>
</body>
</html>
