<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Users - NatID Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar portal-admin">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID <span class="portal-badge bg-danger">Admin</span></span>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="users.html" class="nav-link">Users</a>
      <a href="companies.html" class="nav-link">Companies</a>
      <a href="access-logs.html" class="nav-link">Access Logs</a>
      <a href="#" onclick="logoutAdmin()" class="nav-link nav-logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h4>All Users</h4>

  <div class="card">
    <div class="card-body">
      <table class="table align-middle">
        <thead>
          <tr><th style="width:52px">Photo</th><th>Name</th><th>Email</th><th>Registered</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="usersBody"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  requireAdminAuth();

  async function loadUsers() {
    const token = getToken('admin_token');
    const tbody = document.getElementById('usersBody');

    try {
      const users = await get(API + '/admin/users', token);

      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-muted">No users yet.</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      for (let i = 0; i < users.length; i++) {
        const u = users[i];

        // figure out the status badge
        let statusHtml;
        if (u.is_verified) {
          statusHtml = '<span class="status-approved">Verified</span>';
        } else if (!u.is_active) {
          statusHtml = '<span class="status-rejected">Rejected</span>';
        } else {
          statusHtml = '<span class="status-pending">Pending</span>';
        }

        // use full name if available, fallback to username
        let displayName = u.username;
        if (u.first_name && u.last_name) {
          displayName = u.first_name + ' ' + u.last_name;
        } else if (u.first_name) {
          displayName = u.first_name;
        }

        // profile photo or placeholder
        let avatarHtml;
        if (u.profile_image) {
          avatarHtml = '<img src="http://localhost:8000' + u.profile_image + '" alt="photo" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #dee2e6;">';
        } else {
          avatarHtml = '<div style="width:36px;height:36px;border-radius:50%;background:#e9ecef;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid #dee2e6;">&#128100;</div>';
        }

        const date = new Date(u.created_at).toLocaleDateString();
        const btnClass = u.is_verified ? 'btn-outline-secondary' : 'btn-primary';
        const btnLabel = u.is_verified ? 'View' : 'Review';

        tbody.innerHTML += '<tr>' +
          '<td>' + avatarHtml + '</td>' +
          '<td>' + displayName + '</td>' +
          '<td class="text-muted small">' + u.email + '</td>' +
          '<td class="text-muted small">' + date + '</td>' +
          '<td>' + statusHtml + '</td>' +
          '<td><a href="user-review.html#' + u.id + '" class="btn btn-sm ' + btnClass + '">' + btnLabel + '</a></td>' +
          '</tr>';
      }
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-danger">' + err.message + '</td></tr>';
    }
  }

  loadUsers();
</script>
</body>
</html>
