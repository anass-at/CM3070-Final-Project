<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID - Admin Portal</span>
    <a href="../index.html" class="nav-link">Home</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4">
        <h4 class="mb-3">Admin Login</h4>
        <div id="msg" style="display:none"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" id="submitBtn" data-label="Login" class="btn btn-danger w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  if (getToken('admin_token')) location.href = 'dashboard.html';

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    setLoading(btn, true);
    hideAlert('msg');

    try {
      const data = await post(`${API}/auth/login`, {
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      const me = await get(`${API}/auth/me`, data.access_token);
      if (me.role !== 'admin') {
        showError('msg', 'This portal is for admins only.');
        setLoading(btn, false);
        return;
      }

      saveToken('admin_token', data.access_token);
      location.href = 'dashboard.html';
    } catch (err) {
      showError('msg', err.message);
      setLoading(btn, false);
    }
  });
</script>
</body>
</html>
