<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In to Authorise - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar portal-user">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID <span class="portal-badge bg-primary">Citizen</span></span>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">

        <div class="text-center mb-4">
          <div style="font-size:40px;">🔐</div>
          <h5 class="mt-2 mb-0">Sign in to NatID</h5>
          <p id="clientLabel" class="text-muted small mt-1">A third-party application is requesting access to your identity data.</p>
        </div>

        <div id="msg" style="display:none" class="mb-3"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" id="loginBtn" data-label="Sign In & Continue" class="btn btn-primary w-100">Sign In & Continue</button>
        </form>

        <div class="mt-3 text-center">
          <button class="btn btn-link btn-sm text-muted" onclick="cancelLogin()">Cancel and go back</button>
        </div>

        <hr class="mt-4">
        <p class="text-muted small text-center mb-0">
          By signing in you allow the requesting application to access the identity data fields you approve on the next screen.
          NatID never shares your password.
        </p>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  var challenge = new URLSearchParams(location.search).get('login_challenge');

  if (!challenge) {
    document.getElementById('msg').style.display = 'block';
    document.getElementById('msg').className = 'alert alert-danger';
    document.getElementById('msg').textContent = 'Missing login challenge. This page should be opened by an OAuth2 flow.';
    document.getElementById('loginForm').style.display = 'none';
  } else {
    // fetch challenge info to show the requesting client name
    fetch(API + '/hydra/login?login_challenge=' + encodeURIComponent(challenge))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.client_name) {
          document.getElementById('clientLabel').textContent =
            '"' + data.client_name + '" is requesting access to your identity data.';
        }
      })
      .catch(function() {});
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    setLoading(btn, true);
    hideAlert('msg');

    try {
      var result = await post(API + '/hydra/login', {
        login_challenge: challenge,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      // Hydra tells us where to send the user next (consent page)
      window.location.replace(result.redirect_to);
    } catch (err) {
      showError('msg', err.message);
      setLoading(btn, false);
    }
  });

  async function cancelLogin() {
    try {
      var result = await post(API + '/hydra/login/reject', { login_challenge: challenge });
      window.location.replace(result.redirect_to);
    } catch (err) {
      history.back();
    }
  }
</script>
</body>
</html>
