<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Log - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar portal-user">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID <span class="portal-badge bg-primary">Citizen</span></span>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="profile.html" class="nav-link">My Profile</a>
      <a href="documents.html" class="nav-link">Documents</a>
      <a href="access-log.html" class="nav-link">Access Log</a>
      <a href="#" onclick="logoutUser()" class="nav-link nav-logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h4>Access Log</h4>
  <p class="text-muted">Every time a company accesses your data, it gets recorded here.</p>

  <div class="card">
    <div class="card-body">
      <table class="table">
        <thead>
          <tr><th>Company</th><th>Scope used</th><th>Endpoint</th><th>Status</th><th>Date</th></tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="5" class="text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  requireUserAuth();

  async function loadLogs() {
    const token = getToken('user_token');
    try {
      const logs = await get(`${API}/auth/access-logs`, token);
      const tbody = document.getElementById('logBody');
      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-muted">No access records yet.</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map(log => `
        <tr>
          <td>${log.company_name}</td>
          <td><span class="scope-tag">${log.scope_used}</span></td>
          <td><small class="text-muted">${log.endpoint}</small></td>
          <td><span class="badge ${log.status_code === 200 ? 'bg-success' : 'bg-danger'}">${log.status_code}</span></td>
          <td>${new Date(log.created_at).toLocaleString()}</td>
        </tr>
      `).join('');
    } catch (err) {
      document.getElementById('logBody').innerHTML = `<tr><td colspan="5" class="text-danger">${err.message}</td></tr>`;
    }
  }

  loadLogs();
</script>
</body>
</html>
