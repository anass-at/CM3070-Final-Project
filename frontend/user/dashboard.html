<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    .avatar { width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid #dee2e6; }
    .avatar-placeholder { width:56px; height:56px; border-radius:50%; background:#e9ecef; display:flex; align-items:center; justify-content:center; font-size:24px; border:2px solid #dee2e6; flex-shrink:0; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID - User Portal</span>
    <div>
      <a href="dashboard.html" class="nav-link d-inline">Dashboard</a>
      <a href="profile.html" class="nav-link d-inline">My Profile</a>
      <a href="documents.html" class="nav-link d-inline">Documents</a>
      <a href="access-log.html" class="nav-link d-inline">Access Log</a>
      <a href="#" onclick="logoutUser()" class="nav-link d-inline">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">

  <!-- welcome row with avatar -->
  <div class="d-flex align-items-center gap-3 mb-3">
    <div id="avatarPlaceholder" class="avatar-placeholder">&#128100;</div>
    <img id="avatarImg" src="" alt="Profile" class="avatar d-none">
    <div>
      <h4 class="mb-0">Welcome, <span id="welcomeName">...</span></h4>
      <p class="text-muted small mb-0" id="welcomeEmail"></p>
    </div>
  </div>

  <div id="statusBadge" class="alert alert-warning mt-2">Loading...</div>

  <div class="row mt-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h5>Profile Completion</h5>
          <ul id="profileList" class="mb-2"><li>Loading...</li></ul>
          <a href="profile.html" class="btn btn-sm btn-outline-primary">Edit Profile</a>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h5>Recent Access to My Data</h5>
          <table class="table table-sm">
            <thead><tr><th>Company</th><th>Scope</th><th>Date</th></tr></thead>
            <tbody id="accessLogBody"><tr><td colspan="3">Loading...</td></tr></tbody>
          </table>
          <a href="access-log.html" class="btn btn-sm btn-outline-secondary">See full log</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  requireUserAuth();

  async function loadDashboard() {
    var token = getToken('user_token');

    try {
      var user = await get(API + '/auth/me', token);

      // name
      var name = user.username;
      if (user.first_name && user.last_name) {
        name = user.first_name + ' ' + user.last_name;
      } else if (user.first_name) {
        name = user.first_name;
      }
      document.getElementById('welcomeName').textContent = name;
      document.getElementById('welcomeEmail').textContent = user.email;

      // profile image
      if (user.profile_image) {
        document.getElementById('avatarImg').src = 'http://localhost:8000' + user.profile_image;
        document.getElementById('avatarImg').classList.remove('d-none');
        document.getElementById('avatarPlaceholder').style.display = 'none';
      }

      // status badge
      if (user.is_verified) {
        document.getElementById('statusBadge').className = 'alert alert-success mt-2';
        document.getElementById('statusBadge').innerHTML = '<strong>Status: Verified</strong> — Your identity has been confirmed by an admin.';
      } else if (!user.is_active) {
        var reasonText = user.rejection_reason ? '<br><span class="small">Reason: ' + user.rejection_reason + '</span>' : '';
        document.getElementById('statusBadge').className = 'alert alert-danger mt-2';
        document.getElementById('statusBadge').innerHTML = '<strong>Status: Rejected</strong> — Your identity verification was rejected by an admin.' + reasonText;
      } else {
        document.getElementById('statusBadge').className = 'alert alert-warning mt-2';
        document.getElementById('statusBadge').innerHTML = '<strong>Status: Pending Verification</strong> — Submit your identity details and document so an admin can verify you.';
      }

      // profile checklist
      var checks = [
        { done: true,                              label: 'Account created' },
        { done: !!(user.first_name),               label: 'First name added',    link: 'profile.html' },
        { done: !!(user.last_name),                label: 'Last name added',     link: 'profile.html' },
        { done: !!(user.national_id),              label: 'National ID added',   link: 'profile.html' },
        { done: !!(user.phone_number),             label: 'Phone number added',  link: 'profile.html' },
        { done: !!(user.document_path),            label: 'Document uploaded',   link: 'documents.html' },
        { done: !!(user.profile_image),            label: 'Profile photo added', link: 'profile.html' },
      ];

      var list = document.getElementById('profileList');
      list.innerHTML = '';
      for (var i = 0; i < checks.length; i++) {
        var c = checks[i];
        var icon = c.done ? '&#10003;' : '&#10007;';
        var linkPart = (!c.done && c.link) ? ' — <a href="' + c.link + '">add it</a>' : '';
        list.innerHTML += '<li>' + icon + ' ' + c.label + linkPart + '</li>';
      }

    } catch (err) {
      console.log('Failed to load user data:', err.message);
    }

    // access logs
    try {
      var token2 = getToken('user_token');
      var logs = await get(API + '/auth/access-logs', token2);
      var tbody = document.getElementById('accessLogBody');
      tbody.innerHTML = '';

      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-muted">No access yet</td></tr>';
      } else {
        var max = logs.length > 3 ? 3 : logs.length;
        for (var j = 0; j < max; j++) {
          var log = logs[j];
          var date = new Date(log.created_at).toLocaleDateString();
          tbody.innerHTML += '<tr><td>' + log.company_name + '</td><td><span class="scope-tag">' + log.scope_used + '</span></td><td>' + date + '</td></tr>';
        }
      }
    } catch (err) {
      document.getElementById('accessLogBody').innerHTML = '<tr><td colspan="3" class="text-muted">Could not load logs</td></tr>';
    }
  }

  loadDashboard();
</script>
</body>
</html>
