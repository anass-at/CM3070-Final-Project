<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Documents - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar portal-user">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID <span class="portal-badge bg-primary">Citizen</span></span>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="profile.html" class="nav-link">My Profile</a>
      <a href="documents.html" class="nav-link">Documents</a>
      <a href="access-log.html" class="nav-link">Access Log</a>
      <a href="#" onclick="logoutUser()" class="nav-link nav-logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h4>My Documents</h4>
  <p class="text-muted">Upload an official identity document for admin verification. Documents are never shared with companies.</p>

  <div id="msg" style="display:none"></div>

  <div class="card mb-4">
    <div class="card-body">
      <h6>Current Document</h6>
      <div id="docStatus">Loading...</div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h6>Upload Document</h6>
      <form id="uploadForm">
        <div class="mb-3">
          <label class="form-label">File</label>
          <input type="file" id="docFile" class="form-control" required>
          <div class="form-text">Accepted: images, PDF. Max 10MB.</div>
        </div>
        <button type="submit" id="uploadBtn" data-label="Upload" class="btn btn-primary">Upload</button>
      </form>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  requireUserAuth();

  const token = getToken('user_token');

  async function loadDocStatus() {
    try {
      var user = await get(API + '/auth/me', token);
      var el = document.getElementById('docStatus');

      if (user.document_path) {
        var filename = user.document_path.split('/').pop();
        var fileUrl = 'http://localhost:8000' + user.document_path;
        var isImage = filename.match(/\.(jpg|jpeg|png|webp)$/i);
        var statusBadge = user.is_verified
          ? '<span class="badge bg-success">Verified by admin</span>'
          : '<span class="badge bg-warning text-dark">Pending review</span>';

        var preview = '';
        if (isImage) {
          preview = '<div class="mt-3"><img src="' + fileUrl + '" alt="Document" style="max-width:100%; max-height:280px; border-radius:6px; border:1px solid #dee2e6"></div>';
        } else {
          preview = '<div class="mt-2"><a href="' + fileUrl + '" target="_blank" class="btn btn-sm btn-outline-secondary">Open PDF</a></div>';
        }

        el.innerHTML =
          '<div class="d-flex align-items-center gap-2">' +
            '<span class="text-success fw-bold">&#10003; Uploaded</span>' +
            '<span class="text-muted small">' + filename + '</span>' +
            statusBadge +
          '</div>' +
          preview;
      } else {
        el.innerHTML = '<span class="text-muted">No document uploaded yet.</span>';
      }
    } catch (err) {
      console.log('Could not load document status:', err.message);
      document.getElementById('docStatus').textContent = 'Could not load document status.';
    }
  }

  document.getElementById('uploadForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('uploadBtn');
    const file = document.getElementById('docFile').files[0];
    if (!file) return;

    setLoading(btn, true);
    hideAlert('msg');

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch(`${API}/auth/upload-document`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed');
      showSuccess('msg', 'Document uploaded successfully. An admin will review it shortly.');
      document.getElementById('uploadForm').reset();
      loadDocStatus();
    } catch (err) {
      showError('msg', err.message);
    } finally {
      setLoading(btn, false);
    }
  });

  loadDocStatus();
</script>
</body>
</html>
