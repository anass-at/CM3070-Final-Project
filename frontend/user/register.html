<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Register - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID - User Portal</span>
    <a href="../index.html" class="nav-link">Home</a>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h4 class="mb-3">Create Account</h4>

        <div id="msg" style="display:none"></div>

        <form id="registerForm">
          <h6 class="text-muted">Account Info</h6>
          <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required>
          </div>

          <hr>
          <h6 class="text-muted">Identity Details</h6>
          <div class="row mb-2">
            <div class="col">
              <label class="form-label">First Name</label>
              <input type="text" id="first_name" class="form-control">
            </div>
            <div class="col">
              <label class="form-label">Last Name</label>
              <input type="text" id="last_name" class="form-control">
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Date of Birth</label>
            <input type="date" id="birth_date" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label">Location</label>
            <input type="text" id="location" class="form-control" placeholder="e.g. Riyadh, Saudi Arabia">
          </div>
          <div class="mb-3">
            <label class="form-label">National ID <small class="text-muted">(used for verification only, never shared)</small></label>
            <input type="text" id="national_id" class="form-control">
          </div>

          <button type="submit" id="submitBtn" data-label="Register" class="btn btn-primary w-100">Register</button>
        </form>

        <p class="mt-3 text-center">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    setLoading(btn, true);
    hideAlert('msg');

    try {
      // Step 1: create account
      await post(`${API}/auth/register`, {
        email:    document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      });

      // Step 2: auto-login to get token
      const loginData = await post(`${API}/auth/login`, {
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      saveToken('user_token', loginData.access_token);

      // Step 3: save identity details if provided
      const profile = {};
      ['first_name', 'last_name', 'birth_date', 'location', 'national_id'].forEach(f => {
        const val = document.getElementById(f).value;
        if (val) profile[f] = val;
      });
      if (Object.keys(profile).length > 0) {
        await put(`${API}/auth/profile`, profile, loginData.access_token);
      }

      location.href = 'dashboard.html';
    } catch (err) {
      showError('msg', err.message);
      setLoading(btn, false);
    }
  });
</script>
</body>
</html>
