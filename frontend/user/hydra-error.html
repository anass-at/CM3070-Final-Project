<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authorisation Error - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar portal-user">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID <span class="portal-badge bg-primary">Citizen</span></span>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5 text-center">
      <div style="font-size:48px;">⚠️</div>
      <h4 class="mt-3">Authorisation Error</h4>
      <p id="errorMsg" class="text-muted">Something went wrong during the authorisation process.</p>
      <a href="dashboard.html" class="btn btn-primary mt-2">Go to Dashboard</a>
    </div>
  </div>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var error = params.get('error');
  var desc  = params.get('error_description');
  if (error || desc) {
    document.getElementById('errorMsg').textContent = desc || error;
  }
</script>
</body>
</html>
