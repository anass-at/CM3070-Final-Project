<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID - Company Portal</span>
    <a href="../index.html" class="nav-link">Home</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4">
        <h4 class="mb-1">Forgot Password</h4>
        <p class="text-muted small mb-3">Enter your company's registered email address and we'll send you a password reset link.</p>

        <div id="msg" style="display:none"></div>

        <form id="forgotForm">
          <div class="mb-3">
            <label class="form-label">Company Email</label>
            <input type="email" id="email" class="form-control" required autofocus>
          </div>
          <button type="submit" id="submitBtn" data-label="Send Reset Link" class="btn btn-success w-100">Send Reset Link</button>
        </form>

        <p class="mt-3 text-center small"><a href="login.html">Back to Login</a></p>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    setLoading(btn, true);
    hideAlert('msg');

    try {
      var result = await post(API + '/company/forgot-password', {
        email: document.getElementById('email').value.trim()
      });
      showSuccess('msg', result.message);
      document.getElementById('forgotForm').style.display = 'none';
    } catch (err) {
      showError('msg', err.message);
      setLoading(btn, false);
    }
  });
</script>
</body>
</html>
