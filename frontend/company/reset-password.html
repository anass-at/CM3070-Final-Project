<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - NatID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <span class="navbar-brand fw-bold">NatID - Company Portal</span>
    <a href="../index.html" class="nav-link">Home</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4">

        <!-- invalid token state -->
        <div id="invalidCard" style="display:none" class="text-center">
          <div style="font-size:48px;">⚠️</div>
          <h5 class="mt-2">Invalid or Expired Link</h5>
          <p class="text-muted small">This reset link is invalid or has expired. Reset links are valid for 1 hour.</p>
          <a href="forgot-password.html" class="btn btn-success mt-2">Request a New Link</a>
        </div>

        <!-- reset form -->
        <div id="resetCard">
          <h4 class="mb-1">Set New Password</h4>
          <p class="text-muted small mb-3">Choose a strong password — at least 8 characters.</p>

          <div id="msg" style="display:none"></div>

          <form id="resetForm">
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" id="newPw" class="form-control" minlength="8" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" id="confirmPw" class="form-control" minlength="8" required>
            </div>
            <button type="submit" id="submitBtn" data-label="Reset Password" class="btn btn-success w-100">Reset Password</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  var token = new URLSearchParams(location.search).get('token');

  if (!token) {
    document.getElementById('resetCard').style.display = 'none';
    document.getElementById('invalidCard').style.display = 'block';
  }

  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var newPw     = document.getElementById('newPw').value;
    var confirmPw = document.getElementById('confirmPw').value;

    if (newPw !== confirmPw) {
      showError('msg', 'Passwords do not match.');
      return;
    }

    setLoading(btn, true);
    hideAlert('msg');

    try {
      var result = await post(API + '/company/reset-password', {
        token: token,
        new_password: newPw
      });
      showSuccess('msg', result.message + ' Redirecting to login...');
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(function () { location.href = 'login.html'; }, 2000);
    } catch (err) {
      if (err.message && err.message.toLowerCase().includes('expired')) {
        document.getElementById('resetCard').style.display = 'none';
        document.getElementById('invalidCard').style.display = 'block';
      } else {
        showError('msg', err.message);
        setLoading(btn, false);
      }
    }
  });
</script>
</body>
</html>
